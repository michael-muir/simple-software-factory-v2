name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts are valid
        run: |
          bash -n install.sh factory/checks.sh
          shellcheck install.sh factory/checks.sh

      - name: Python scripts compile and stay 3.9-compatible
        run: |
          python3 -m py_compile factory/bin/board factory/bin/gate factory/bin/route
          python3 -m pip install --quiet --user --break-system-packages vermin
          "$(python3 -m site --user-base)/bin/vermin" -q --no-tips -t=3.9- --eval-annotations factory/bin/board factory/bin/gate factory/bin/route

      - name: JSON files are valid
        run: |
          python3 -m json.tool factory/config.json > /dev/null

      - name: Agents have frontmatter
        run: |
          python3 -m pip install --quiet --user --break-system-packages pyyaml
          for f in .claude/agents/*.md; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding="utf-8").read().split("---\n")[1])' "$f" \
              || { echo "$f frontmatter isn't valid YAML (Claude Code skips the agent)"; exit 1; }
          done
          for f in .claude/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f has no frontmatter"; exit 1; }
            grep -q "^name: $(basename "$f" .md)$" "$f" || { echo "$f name doesn't match"; exit 1; }
          done

      - name: Dashboard script parses
        run: |
          sed -n '/<script>/,/<\/script>/p' factory/dashboard.html | sed '1d;$d' > "$RUNNER_TEMP/dashboard.js"
          node --check "$RUNNER_TEMP/dashboard.js"
