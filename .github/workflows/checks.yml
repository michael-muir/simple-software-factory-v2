name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Shell scripts are valid
        run: |
          bash -n install.sh factory/checks.sh
          shellcheck install.sh factory/checks.sh

      - name: Python scripts compile
        run: python -m py_compile factory/bin/board factory/bin/gate factory/bin/route tests/*.py

      - name: JSON files are valid
        run: |
          python -m json.tool factory/config.json > /dev/null
          for f in examples/jobs/*/job.json; do python -m json.tool "$f" > /dev/null; done

      - name: Agents have frontmatter
        run: |
          for f in .claude/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f has no frontmatter"; exit 1; }
            grep -q "^name: $(basename "$f" .md)$" "$f" || { echo "$f name doesn't match"; exit 1; }
          done

      - name: End-to-end tests (installer, board, gate, route)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          python -m unittest discover -s tests -v

      - name: Dashboard script parses
        run: |
          sed -n '/<script>/,/<\/script>/p' factory/dashboard.html | sed '1d;$d' > "$RUNNER_TEMP/dashboard.js"
          node --check "$RUNNER_TEMP/dashboard.js"
