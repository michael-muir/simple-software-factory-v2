<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1115; --col: #171a21; --card: #1f242e; --line: #2b313d;
    --text: #d7dce4; --dim: #8b93a1;
    --pass: #3fb67c; --changes: #e0604f; --pending: #4a5261;
    --human: #e8b14e; --merged: #5a8df0; --info: #b48ef0;
    --low: #3fb67c; --medium: #e8b14e; --high: #e0604f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  a { color: var(--merged); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header span { color: var(--dim); font-size: 12px; }
  header .stats { margin-left: auto; color: var(--text); display: flex; gap: 14px; }
  header .stats b { font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(10, minmax(150px, 1fr));
           gap: 10px; padding: 0 20px 20px; align-items: start; overflow-x: auto; }
  .col { background: var(--col); border-radius: 10px; padding: 10px; min-height: 140px; }
  .col h2 { margin: 2px 4px 10px; font-size: 11px; font-weight: 600; display: flex;
            text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
  .col h2 .n { margin-left: auto; }
  .col.needs-human h2 { color: var(--human); }
  .col.needs-info h2 { color: var(--info); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .card:hover, .card:focus-visible { border-color: var(--dim); outline: none; }
  .card.needs-human { border-color: var(--human); box-shadow: 0 0 0 1px var(--human); }
  .card.needs-info { border-color: var(--info); }
  .card.rejected { opacity: .55; }
  .card .top { display: flex; gap: 6px; align-items: center; font-size: 11px;
               color: var(--dim); font-family: ui-monospace, monospace; }
  .card .top .links { margin-left: auto; display: flex; gap: 6px; white-space: nowrap; }
  .card .title { margin: 3px 0 6px; font-weight: 600; }
  .card .note { font-size: 11px; color: var(--human); margin: -2px 0 6px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .note.waiting { color: var(--dim); }
  .pill { font-size: 10px; padding: 0 6px; border-radius: 9px; border: 1px solid currentColor;
          text-transform: lowercase; font-family: ui-sans-serif, system-ui, sans-serif; }
  .pill.low { color: var(--low); } .pill.medium { color: var(--medium); }
  .pill.high { color: var(--high); } .pill.merged { color: var(--merged); }
  .pill.rejected { color: var(--dim); }
  .round { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .round .r { font-size: 10px; color: var(--dim); width: 18px; font-family: ui-monospace, monospace; }
  .chip { flex: 1 0 30px; text-align: center; font-size: 10px; padding: 2px 0;
          border-radius: 4px; background: var(--pending); color: #cfd4dc;
          text-transform: lowercase; white-space: nowrap; overflow: hidden; }
  .chip.gate { flex: 0 0 34px; }
  .chip.PASS { background: var(--pass); color: #06281a; }
  .chip.CHANGES, .chip.FAIL, .chip.INVALID { background: var(--changes); color: #2d0b07; }
  .meta { display: flex; gap: 10px; font-size: 11px; color: var(--dim); margin-top: 6px;
          white-space: nowrap; }
  .meta .cost { margin-left: auto; }
  .empty { color: var(--dim); font-size: 12px; padding: 4px; }
  .notice { margin: 0 20px 12px; padding: 10px 14px; border-radius: 8px;
            background: var(--col); color: var(--dim); font-size: 13px; }
  .notice code { color: var(--text); }
  /* modal */
  dialog { background: var(--col); color: var(--text); border: 1px solid var(--line);
           border-radius: 12px; width: min(860px, 94vw); max-height: 90vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start;
                padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 12px; }
  .modal-head .sub { display: block; font-weight: 400; font-size: 11px; color: var(--dim);
                     font-family: ui-monospace, monospace; margin-top: 2px; }
  .modal-head button { background: none; border: none; color: var(--dim);
                       font-size: 18px; cursor: pointer; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           gap: 6px 14px; padding: 10px 18px; font-size: 12px; border-bottom: 1px solid var(--line); }
  .facts div.wide { grid-column: 1 / -1; white-space: pre-wrap; line-height: 1.55; }
  .facts div span { display: block; color: var(--dim); font-size: 10px;
                    text-transform: uppercase; letter-spacing: .08em; }
  .tabs { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tabs button { background: var(--card); border: 1px solid var(--line); color: var(--text);
                 border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .tabs button.active { border-color: var(--merged); color: var(--merged); }
  .tabs button .v { margin-left: 5px; font-size: 10px; }
  .tabs button .v.PASS, .tabs button .v.APPROVE, .tabs button .v.READY, .tabs button .v.ACCEPT { color: var(--pass); }
  .tabs button .v.CHANGES, .tabs button .v.FAIL, .tabs button .v.ESCALATE,
  .tabs button .v.BLOCKED, .tabs button .v.REJECT { color: var(--changes); }
  .tabs button .v.NEEDS-INFO { color: var(--info); }
  .summary { margin: 12px 18px 0; padding: 10px 14px; border-left: 3px solid var(--merged);
             background: var(--card); border-radius: 0 8px 8px 0; font-size: 13px; }
  .summary .verdict { font-weight: 600; margin-bottom: 4px; font-family: ui-monospace, monospace; }
  .summary ul { margin: 0; padding-left: 18px; }
  pre.doc { white-space: pre-wrap; padding: 14px 18px; margin: 0; overflow: auto;
            max-height: 52vh; font: 12.5px/1.6 ui-monospace, monospace; color: var(--text); }
  /* actions on a job that waits on a person */
  .actions { display: flex; align-items: center; gap: 8px; padding: 10px 18px;
             border-bottom: 1px solid var(--line); font-size: 12px; }
  .actions[hidden] { display: none; }
  .actions .why { flex: 1; min-width: 0; color: var(--human); overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .actions .why.failed { color: var(--changes); white-space: normal; }
  .actions .why.working, .actions .why.done { color: var(--dim); }
  .act { background: var(--card); border: 1px solid var(--line); color: var(--text);
         border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .act:hover:not(:disabled), .act:focus-visible { border-color: var(--dim); outline: none; }
  .act:disabled { opacity: .45; cursor: default; }
  .act.approve { border-color: var(--pass); color: var(--pass); }
  .act.reject { border-color: var(--changes); color: var(--changes); }
  .act.answer { border-color: var(--info); color: var(--info); }
  .act.primary { background: var(--merged); border-color: var(--merged); color: #fff; }
  .act.primary.reject { background: var(--changes); border-color: var(--changes); color: #fff; }
  #ask { width: min(520px, 92vw); }
  #ask form { padding: 16px 18px; display: grid; gap: 10px; }
  #ask h3 { margin: 0; font-size: 15px; }
  #ask p { margin: 0; color: var(--dim); font-size: 12px; }
  #ask textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line);
                  border-radius: 6px; padding: 8px; font: 13px/1.5 inherit; min-height: 110px;
                  resize: vertical; }
  #ask textarea:focus { outline: none; border-color: var(--merged); }
  #ask .err { color: var(--changes); font-size: 12px; min-height: 1em; }
  #ask .row { display: flex; justify-content: flex-end; gap: 8px; }
  .history { padding: 0 18px 14px; font-size: 11px; color: var(--dim);
             font-family: ui-monospace, monospace; max-height: 120px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>SOFTWARE FACTORY</h1>
  <span>issue → intake → spec → build → gate → routed reviews → approve → PR merge · polls board.json</span>
  <span class="stats" id="stats"></span>
</header>
<div id="notice"></div>
<div class="board" id="board"></div>

<dialog id="modal">
  <div class="modal-head"><div><strong id="modal-title"></strong>
    <span class="sub" id="modal-sub"></span></div>
    <button onclick="modal.close()" aria-label="Close">✕</button></div>
  <div class="actions" id="actions" hidden></div>
  <div class="facts" id="facts"></div>
  <div class="tabs" id="tabs"></div>
  <div id="summary"></div>
  <pre class="doc" id="doc"></pre>
  <div class="history" id="history"></div>
</dialog>

<dialog id="ask">
  <form id="ask-form">
    <h3 id="ask-title"></h3>
    <p id="ask-help"></p>
    <textarea id="ask-text"></textarea>
    <div class="err" id="ask-err" role="alert"></div>
    <div class="row">
      <button type="button" class="act" id="ask-cancel">Cancel</button>
      <button type="submit" class="act primary" id="ask-send"></button>
    </div>
  </form>
</dialog>

<script>
const COLUMNS = [
  ["intake", ["intake"]], ["spec", ["spec"]], ["build", ["build"]], ["gate", ["gate"]],
  ["review", ["review"]], ["approval", ["approval"]], ["merge", ["merge"]],
  ["needs-info", ["needs-info"]], ["needs-human", ["needs-human"]], ["done", ["merged", "rejected"]],
];
const SHORT = { security: "sec" };
const RUNNING = ["intake", "spec", "build", "gate", "review", "approval", "merge"];
const board = document.getElementById("board");
const modal = document.getElementById("modal");
let current = null;   // { job } open in the modal
let token = null;     // set when `board serve` runs the dashboard's buttons
let actions = {};     // job id -> { action, state, message } from board.json
fetch("api/session", { cache: "no-store" })
  .then(r => r.ok ? r.json() : null).then(s => { token = s && s.token; })
  .catch(() => {});

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "—" : `$${Number(v).toFixed(2)}`;
function duration(job) {
  if (!job.created) return "—";
  const end = job.finished ? Date.parse(job.finished) : Date.now();
  const mins = Math.max(0, Math.round((end - Date.parse(job.created)) / 60000));
  return mins >= 60 ? `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, "0")}m` : `${mins}m`;
}

let last = null;
async function refresh() {
  let text;
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    text = await res.text();
  } catch (e) {
    if (last === null) notice("No <code>board.json</code> yet. Run <code>factory/bin/board index</code> " +
      "(or start a job), and serve the dashboard: <code>factory/bin/board serve</code>.");
    return;
  }
  if (text === last) return;   // unchanged: keep focus and hover state
  let data;
  try { data = JSON.parse(text); } catch (e) { return; }   // mid-write
  last = text;
  notice("");
  actions = data.actions || {};
  render(data);
  if (current && modal.open) {
    const fresh = (data.jobs || []).find(j => j.id === current.job.id);
    if (fresh) { current.job = fresh; fillFacts(fresh); fillActions(fresh); }
  }
}

function notice(html) {
  document.getElementById("notice").innerHTML = html ? `<div class="notice">${html}</div>` : "";
}

function render(data) {
  const jobs = data.jobs || [];
  const live = jobs.filter(j => RUNNING.includes(j.stage) && !j.waiting_for).length;
  const waiting = jobs.filter(j => j.stage === "needs-human").length;
  const cost = jobs.reduce((t, j) => t + (j.cost_usd || 0), 0);
  document.getElementById("stats").innerHTML =
    `<span><b>${live}</b> / ${esc(data.concurrency ?? "?")} running</span>` +
    (waiting ? `<span style="color:var(--human)"><b>${waiting}</b> need you</span>` : "") +
    `<span>${money(cost)} total</span>`;
  board.innerHTML = "";
  // Columns with jobs get the room; empty ones stay narrow.
  board.style.gridTemplateColumns = COLUMNS.map(([, st]) =>
    jobs.some(j => st.includes(j.stage)) ? "minmax(180px, 1.4fr)" : "minmax(84px, .6fr)").join(" ");
  for (const [name, stages] of COLUMNS) {
    const inCol = jobs.filter(j => stages.includes(j.stage))
                      .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
    const col = document.createElement("div");
    col.className = `col ${name}`;
    col.innerHTML = `<h2>${esc(name)}<span class="n">${inCol.length || ""}</span></h2>`;
    if (!inCol.length) col.insertAdjacentHTML("beforeend", `<div class="empty">—</div>`);
    for (const job of inCol) col.appendChild(card(job));
    board.appendChild(col);
  }
}

function reviewersOf(job) { return Object.keys((job.agents || {}).reviewers || {}); }

function roundRows(job, max = 3) {
  const rows = [];
  const total = job.round || 0;
  for (let n = Math.max(1, total - max + 1); n <= total; n++) {
    const gate = (job.gates || {})[n];
    const merge = (job.merge_gates || {})[n];
    const revs = (job.reviews || {})[n];
    let chips = `<div class="chip gate ${esc(gate || "")}" title="gate">${gate ? "gate" : "·"}</div>`;
    if (revs) chips += reviewersOf(job).map(r =>
      `<div class="chip ${esc(revs[r] || "")}" title="${esc(r)}: ${esc(revs[r] || "pending")}">${esc(SHORT[r] || r)}</div>`).join("");
    if (merge) chips += `<div class="chip gate ${esc(merge)}" title="merge gate">merge</div>`;
    rows.push(`<div class="round"><span class="r">r${n}</span>${chips}</div>`);
  }
  return rows.join("");
}

function card(job) {
  const el = document.createElement("div");
  el.className = `card ${job.stage}`;
  const issue = job.issue_url ? `<a href="${esc(job.issue_url)}" target="_blank" rel="noopener">#${esc(job.issue)}</a>`
                              : (job.issue ? `#${esc(job.issue)}` : "");
  const pr = job.pr_url ? `<a href="${esc(job.pr_url)}" target="_blank" rel="noopener">PR ${esc(job.pr)}</a>` : "";
  const badge = job.stage === "merged" || job.stage === "rejected"
    ? `<span class="pill ${job.stage}">${job.stage}</span>`
    : (job.risk ? `<span class="pill ${esc(job.risk)}">${esc(job.risk)}</span>` : "");
  const note = (job.stage === "needs-human" || job.stage === "needs-info" || job.waiting_for) && job.note
    ? `<div class="note${job.waiting_for ? " waiting" : ""}" title="${esc(job.note)}">${esc(job.note)}</div>` : "";
  el.innerHTML = `
    <div class="top"><span>${esc(job.id.split("-")[0])}</span>${badge}
      <span class="links">${issue}${pr}</span></div>
    <div class="title">${esc(job.title || job.id)}</div>
    ${note}
    ${roundRows(job)}
    <div class="meta"><span>${job.round ? `round ${esc(job.round)}/${esc(job.max_round)}` : esc(job.stage)}</span>
      <span>${duration(job)}</span><span class="cost">${money(job.cost_usd)}</span></div>`;
  for (const a of el.querySelectorAll("a")) a.onclick = e => e.stopPropagation();
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", `${job.id}, ${job.stage}`);
  el.onclick = () => openJob(job);
  el.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openJob(job); }
  };
  return el;
}

function fillFacts(job) {
  document.getElementById("modal-title").textContent = `${job.id} · ${job.stage}`;
  document.getElementById("modal-sub").textContent =
    [job.branch, job.worktree].filter(Boolean).join(" · ");
  const revs = Object.entries((job.agents || {}).reviewers || {}).map(([r, m]) => `${r} (${m})`).join(", ");
  const link = (url, label) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : "—";
  const facts = [
    ["issue", link(job.issue_url, `#${job.issue}`)],
    ["pull request", link(job.pr_url, job.pr ? `#${job.pr}` : "")],
    ["risk", esc(job.risk || "—")],
    ["surfaces", esc((job.surfaces || []).join(", ") || "none")],
    ["reviewers", esc(revs || "—")],
    ["round", job.round ? `${esc(job.round)} of ${esc(job.max_round)}` : "—"],
    ["cost (API-equivalent)", money(job.cost_usd)],
    ["time", duration(job)],
  ];
  if (job.note) facts.push(["note", esc(job.note), "wide"]);
  document.getElementById("facts").innerHTML =
    facts.map(([k, v, cls]) => `<div${cls ? ` class="${cls}"` : ""}><span>${k}</span>${v}</div>`).join("");
  document.getElementById("history").innerHTML = (job.history || []).slice().reverse()
    .map(h => `${esc(h.at)}  ${esc(h.event)}`).join("<br>");
}

// --- Approve / Rework / Reject --------------------------------------------

const ACTION_TEXT = {
  approve: { label: "Approve", send: "Merge",
             title: job => `Approve and merge PR #${job.pr}?`,
             help: "The factory merges the latest main into the branch, runs the checks again, and merges the PR." },
  rework:  { label: "Rework", send: "Send to the builder",
             title: () => "Send it back to the builder",
             help: "Say what should change, or leave it empty to have the builder fix why the job stopped. A fresh builder starts a new round.",
             placeholder: "e.g. Make the move buttons 44px tall, and the delete button too" },
  answer:  { label: "Answer", send: "Post the answer",
             title: job => `Answer intake's questions on #${job.issue}`,
             help: "Your answer is posted on the issue as a comment from you, and intake runs again with it.",
             placeholder: "Answer each of intake's questions. To reread them, Cancel and open intake.md." },
  reject:  { label: "Reject", send: "Reject the job",
             title: () => "Reject this job",
             help: "Say why. This is posted on the issue, and the PR is closed.",
             placeholder: "e.g. Out of scope: we're replacing the board next month" },
};
const WORKING = { approve: "Merging: syncing with main and running the checks…",
                  rework: "Sending it back to the builder…", reject: "Rejecting…",
                  answer: "Posting your answer…" };

function offered(job) {
  if (job.stage === "needs-human") return job.pr ? ["approve", "rework", "reject"] : ["rework", "reject"];
  if (job.stage === "needs-info") return ["answer", "reject"];
  return [];
}

function fillActions(job) {
  const bar = document.getElementById("actions");
  const st = actions[job.id];
  const list = offered(job);
  if (!token || (!list.length && !st)) { bar.hidden = true; return; }
  bar.hidden = false;
  let why = esc(job.note || ""), cls = "";
  if (st && st.state === "working") { why = esc(WORKING[st.action]); cls = "working"; }
  else if (st && st.state === "failed") { why = `${esc(ACTION_TEXT[st.action].label)} failed: ${esc(st.message)}`; cls = "failed"; }
  else if (st && st.state === "done" && !list.length) { why = esc(st.message); cls = "done"; }
  const busy = st && st.state === "working";
  bar.innerHTML = `<span class="why ${cls}" title="${why}">${why}</span>` +
    list.map(a => `<button class="act ${a}" data-a="${a}"${busy ? " disabled" : ""}>${ACTION_TEXT[a].label}</button>`).join("");
  for (const b of bar.querySelectorAll("button")) b.onclick = () => ask(job, b.dataset.a);
}

const askDialog = document.getElementById("ask");
function ask(job, action) {
  const t = ACTION_TEXT[action];
  const text = document.getElementById("ask-text");
  document.getElementById("ask-title").textContent = t.title(job);
  document.getElementById("ask-help").textContent = t.help;
  document.getElementById("ask-err").textContent = "";
  const send = document.getElementById("ask-send");
  send.textContent = t.send;
  send.disabled = false;
  send.className = `act primary${action === "reject" ? " reject" : ""}`;
  text.value = "";
  text.hidden = action === "approve";
  text.placeholder = t.placeholder || "";
  document.getElementById("ask-form").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("ask-err");
    if ((action === "reject" || action === "answer") && !text.value.trim()) {
      err.textContent = action === "reject" ? "Write a reason first." : "Write your answer first.";
      text.focus(); return;
    }
    send.disabled = true;
    try {
      const res = await fetch(`api/${action}/${encodeURIComponent(job.id)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Factory-Token": token },
        body: JSON.stringify({ text: text.value }),
      });
      if (!res.ok) {
        err.textContent = (await res.json().catch(() => ({}))).error || `Failed (${res.status})`;
        send.disabled = false;
        return;
      }
    } catch (e) {
      err.textContent = "The dashboard server isn't reachable. Is factory/bin/board serve running?";
      send.disabled = false;
      return;
    }
    actions[job.id] = { action, state: "working", message: "" };
    askDialog.close();
    fillActions(current ? current.job : job);
    refresh();
  };
  askDialog.showModal();
  (action === "approve" ? send : text).focus();
}
document.getElementById("ask-cancel").onclick = () => askDialog.close();

function openJob(job) {
  current = { job };
  fillFacts(job);
  fillActions(job);
  const files = job.files && job.files.length ? job.files : ["issue.md"];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const f of files) {
    const b = document.createElement("button");
    b.textContent = f;
    b.onclick = () => showFile(job, f, b);
    tabs.appendChild(b);
  }
  // Open on the file that explains where the job is now.
  const prefer = { "needs-human": "decision.md", "needs-info": "intake.md", "rejected": "rejection.md" };
  let want = files.includes(prefer[job.stage]) ? prefer[job.stage] : files[files.length - 1];
  if (job.stage === "rejected" && !files.includes("rejection.md") && files.includes("intake.md")) want = "intake.md";
  if (job.stage === "needs-human" && !files.includes("decision.md")) {
    // The last round's failing gate or review explains why it stopped.
    const n = job.round, revs = (job.reviews || {})[n] || {};
    const bad = Object.keys(revs).find(r => revs[r] === "CHANGES");
    if (bad) want = `round-${n}/review-${bad}.md`;
    else if ((job.gates || {})[n] === "FAIL") want = `round-${n}/checks.md`;
    else if (files.includes("build.md")) want = "build.md";
  }
  const idx = Math.max(0, files.indexOf(want));
  showFile(job, files[idx], tabs.children[idx]);
  modal.showModal();
}

// "## Summary" bullets and the verdict line, shown above the full text.
function summarize(text) {
  const first = (text.split("\n").find(l => l.trim()) || "").trim();
  const m = text.match(/^##\s+Summary\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/mi);
  const bullets = m ? m[1].split("\n").map(l => l.trim()).filter(l => /^[-*]\s/.test(l))
                       .map(l => l.replace(/^[-*]\s+/, "")) : [];
  const verdict = /^(DECISION|STATUS|VERDICT|GATE)\s*:|^(APPROVE|ESCALATE|REJECTED)\b/.test(first) ? first : "";
  return { verdict, bullets };
}

let shown = 0;  // ignore fetches that finish after a newer tab was clicked
async function showFile(job, file, btn) {
  const me = ++shown;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  let text;
  try {
    const res = await fetch(`jobs/${encodeURIComponent(job.id)}/${file.split("/").map(encodeURIComponent).join("/")}`,
                            { cache: "no-store" });
    text = res.ok ? await res.text() : `(${file} not written yet)`;
  } catch (e) { text = `(could not load ${file})`; }
  if (me !== shown) return;
  const { verdict, bullets } = summarize(text);
  document.getElementById("summary").innerHTML = verdict || bullets.length
    ? `<div class="summary">${verdict ? `<div class="verdict">${esc(verdict)}</div>` : ""}` +
      (bullets.length ? `<ul>${bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : "") + `</div>`
    : "";
  document.getElementById("doc").textContent = text;
  if (btn && verdict && !btn.querySelector(".v")) {
    const v = verdict.replace(/^[A-Z]+\s*:\s*/, "").split(/\s/)[0];
    btn.insertAdjacentHTML("beforeend", `<span class="v ${esc(v)}">${esc(v)}</span>`);
  }
}

refresh();
setInterval(refresh, 2000);
</script>
