<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Software Factory</title>
<style>
  :root {
    --bg: #0f1115; --col: #171a21; --card: #1f242e; --line: #2b313d;
    --text: #d7dce4; --dim: #8b93a1;
    --pass: #3fb67c; --changes: #e0604f; --pending: #4a5261;
    --human: #e8b14e; --merged: #5a8df0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header span { color: var(--dim); font-size: 12px; }
  header .live { margin-left: auto; color: var(--text); }
  .board { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr));
           gap: 10px; padding: 0 20px 20px; align-items: start; overflow-x: auto; }
  .col { background: var(--col); border-radius: 10px; padding: 10px; min-height: 140px; }
  .col h2 { margin: 2px 4px 10px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
  .col.needs-human h2 { color: var(--human); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .card:hover, .card:focus-visible { border-color: var(--dim); outline: none; }
  .card.human { border-color: var(--human); box-shadow: 0 0 0 1px var(--human); }
  .card .id { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }
  .card .title { margin: 2px 0 8px; font-weight: 600; }
  .modal-head .sub { display: block; font-weight: 400; font-size: 11px; color: var(--dim);
                     font-family: ui-monospace, monospace; margin-top: 2px; }
  .round { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .chips { display: flex; gap: 5px; }
  .chip { flex: 1; text-align: center; font-size: 10px; padding: 3px 0;
          border-radius: 4px; background: var(--pending); color: #cfd4dc;
          text-transform: lowercase; }
  .chip.PASS { background: var(--pass); color: #06281a; }
  .chip.CHANGES { background: var(--changes); color: #2d0b07; }
  .empty { color: var(--dim); font-size: 12px; padding: 4px; }
  /* modal */
  dialog { background: var(--col); color: var(--text); border: 1px solid var(--line);
           border-radius: 12px; width: min(760px, 90vw); max-height: 85vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal-head { display: flex; justify-content: space-between; align-items: center;
                padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head button { background: none; border: none; color: var(--dim);
                       font-size: 18px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
  .tabs button { background: var(--card); border: 1px solid var(--line); color: var(--text);
                 border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .tabs button.active { border-color: var(--merged); color: var(--merged); }
  pre.doc { white-space: pre-wrap; padding: 14px 18px; margin: 0; overflow: auto;
            max-height: 60vh; font: 12.5px/1.6 ui-monospace, monospace; color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>SOFTWARE FACTORY</h1>
  <span>spec → build → review ×4 → approve → merge · one worktree per job · polls board.json</span>
  <span class="live" id="live"></span>
</header>
<div class="board" id="board"></div>

<dialog id="modal">
  <div class="modal-head"><div><strong id="modal-title"></strong>
    <span class="sub" id="modal-sub"></span></div>
    <button onclick="modal.close()" aria-label="Close">✕</button></div>
  <div class="tabs" id="tabs"></div>
  <pre class="doc" id="doc"></pre>
</dialog>

<script>
const STAGES = ["spec", "build", "review", "approval", "merge", "needs-human", "merged"];
const IN_FLIGHT = ["spec", "build", "review", "approval", "merge"];
const REVIEWERS = ["security", "ux", "ui", "code"];
const board = document.getElementById("board");
const modal = document.getElementById("modal");

let lastBoard = null;
async function refresh() {
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    const text = await res.text();
    const jobs = JSON.parse(text).jobs || [];
    if (text === lastBoard) return;  // unchanged: keep focus and hover state
    lastBoard = text;
    render(jobs);
  } catch (e) { /* mid-write or server gone: keep last render */ }
}

function render(jobs) {
  const live = jobs.filter(j => IN_FLIGHT.includes(j.stage)).length;
  document.getElementById("live").textContent = live ? `${live} in flight` : "idle";
  board.innerHTML = "";
  for (const stage of STAGES) {
    const col = document.createElement("div");
    col.className = "col" + (stage === "needs-human" ? " needs-human" : "");
    col.innerHTML = `<h2>${stage}</h2>`;
    const inStage = jobs.filter(j => j.stage === stage);
    if (!inStage.length) col.insertAdjacentHTML("beforeend", `<div class="empty">—</div>`);
    for (const job of inStage) col.appendChild(card(job));
    board.appendChild(col);
  }
}

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function card(job) {
  const el = document.createElement("div");
  el.className = "card" + (job.stage === "needs-human" ? " human" : "");
  const chips = REVIEWERS.map(r => {
    const v = String((job.reviews || {})[r] || "pending").toUpperCase();
    const cls = v === "PASS" || v === "CHANGES" ? v : "pending";
    return `<div class="chip ${cls}">${r}</div>`;
  }).join("");
  el.innerHTML = `
    <div class="id">${esc(job.id)}</div>
    <div class="title">${esc(job.title || job.feature || job.id)}</div>
    ${job.round ? `<div class="round">round ${esc(job.round)}</div>` : ""}
    <div class="chips">${chips}</div>`;
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.onclick = () => openJob(job);
  el.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openJob(job); }
  };
  return el;
}

function openJob(job) {
  document.getElementById("modal-title").textContent = `${job.id} · ${job.stage}`;
  document.getElementById("modal-sub").textContent =
    [job.branch, job.worktree].filter(Boolean).join(" · ");
  const files = ["spec.md", "build.md"];
  for (let k = 1; k <= (job.reworks || 0); k++) files.push(`rework-${k}.md`);
  for (let n = 1; n <= (job.round || 0); n++)
    for (const r of REVIEWERS) files.push(`round-${n}/review-${r}.md`);
  files.push("decision.md");
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const f of files) {
    const b = document.createElement("button");
    b.textContent = f;
    b.onclick = () => showFile(job, f, b);
    tabs.appendChild(b);
  }
  showFile(job, files[0], tabs.firstChild);
  modal.showModal();
}

let shown = 0;  // ignore fetches that finish after a newer tab was clicked
async function showFile(job, file, btn) {
  const me = ++shown;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  const doc = document.getElementById("doc");
  let text;
  try {
    const res = await fetch(`jobs/${job.id}/${file}`, { cache: "no-store" });
    text = res.ok ? await res.text() : `(${file} not written yet)`;
  } catch (e) { text = `(could not load ${file})`; }
  if (me === shown) doc.textContent = text;
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
